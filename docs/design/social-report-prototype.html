const posts=[{title:'Small details. Better days.',kind:'Carousel',channel:'Instagram',date:'28 Oct, 10:00',reach:null,interactions:142,color:'green',link:false},{title:'A closer look at the craft',kind:'Reel',channel:'Instagram',date:'24 Oct, 18:30',reach:null,interactions:218,color:'peach',link:false},{title:'Made for the everyday',kind:'Static',channel:'Facebook',date:'21 Oct, 10:00',reach:null,interactions:76,color:'',link:false}];
function client(){const other=state.client==='Luma',planned=other?12:20,published=other?9:18,interactions=other?284:436;return `${state.clientMode?`<div class="client-banner"><span>Prepared for <b>${state.client}</b> · ${monthLabel()} · India time</span><button class="btn" id="back-admin">Back to editor</button></div>`:''}<div class="kpis">${kpi('Posts published',n(published),`${n(planned)} planned · unique content items`,true)}${kpi('Reported interactions',n(interactions),'Likes + comments + shares · available data')}${kpi('Follower change',other?'—':'+'+n(124),other?'Not enough comparable snapshots':'Instagram + Facebook follower totals; not unique people')}${kpi('Reach','—','Not available in current data')}</div><div class="split"><section class="panel"><div class="panel-head"><div><h2>Content delivered</h2><p>${monthLabel()} · example weekly publishing trend</p></div><span class="pill">${n(published)} published</span></div>${chart(true)}<div class="chart-note">${n(published)} unique posts · ${n(other?13:26)} successful channel publications. Multi-channel publishing counts once per post.</div></section><section class="panel"><div class="panel-head"><div><h2>Channel snapshot</h2><p>Connected channels and the metrics they report</p></div></div><div class="channel-list"><div class="channel"><span class="channel-icon">◎</span><div><b>Instagram</b><small>@${state.client.toLowerCase()}.studio · sample</small></div><strong>${n(other?8:16)}<small style="display:block">channel publications</small></strong></div><div class="channel"><span class="channel-icon" style="color:#5174bb;background:#f3f7ff">f</span><div><b>Facebook</b><small>${state.client} · sample Page</small></div><strong>${n(other?5:10)}<small style="display:block">channel publications</small></strong></div><div class="notice">Story insights and reach are unavailable in this preview. Their availability depends on supported API data and the connected account.</div></div></section></div><section class="panel" style="margin-bottom:22px"><div class="panel-head"><div><h2>The month's story</h2><p>Editable summary for your client · sample text</p></div>${!state.clientMode?'<button class="text-btn" id="edit-summary">Edit summary ↗</button>':''}</div><div class="summary" id="summary-text">${esc(summaryText())}</div></section><section class="panel"><div class="panel-head"><div><h2>Published content</h2><p>Post-level results · unavailable metrics stay visible as unavailable.</p></div><span class="pill blue">Sample rows</span></div><div class="table-scroll"><table><thead><tr><th>Content</th><th>Channel</th><th>Published · IST</th><th>Reach</th><th>Reported interactions</th><th>Status</th></tr></thead><tbody>${posts.map((p,i)=>`<tr><td><div class="post"><span class="thumb ${p.color}">${['01','02','03'][i]}</span><div><b>${p.title}</b><small style="display:block;color:#9aa8bc">${p.kind}</small></div></div></td><td>${p.channel}</td><td>${state.month==='2026-10'?p.date:['6 Nov, 10:00','4 Nov, 18:30','2 Nov, 10:00'][i]}</td><td><span class="no-data">Not available</span></td><td>${n(Math.round(p.interactions*(other?284/436:1)))}</td><td><span class="pill">Published</span></td></tr>`).join('')}</tbody></table></div><div class="coverage"><span>Metrics freshness: sample timestamp · 7 Nov 2026, 10:30 IST. Current values reflect the provider's latest available totals, not necessarily interactions earned inside this reporting period.</span><span class="pill amber">Partial coverage</span></div></section><div class="bottom-note"><span>ⓘ</span><span><b>Read the numbers with context.</b> Reach is not summed across channels. Follower totals can include the same person more than once. Private staff details, time logs, assignment history and publishing errors are excluded from client exports.</span></div>`}
const summaries={};function summaryText(){return summaries[state.client]||`This period, ${state.client} maintained a steady mix of carousels, Reels and static posts. The craft-focused Reel led the sample interaction results. Next period, we recommend building on that topic and testing one additional short video. This is illustrative commentary for design review, not a conclusion from live account data.`}
function render(){document.body.classList.toggle('client-mode',state.clientMode);$('#content').innerHTML=`<section class="hero"><div><span class="eyebrow">CLEAR WORK. MEANINGFUL RESULTS.</span><h1>${state.clientMode?state.client+' · Social report':'Social reports'}</h1><p>${state.view==='team'?'Understand the work behind every post, with fair credit and clear deadlines.':'Turn your content delivery and available channel data into a clear client story.'}</p></div><div class="actions">${state.view==='client'&&!state.clientMode?'<button class="btn" id="client-preview">Client view ↗</button>':''}<button class="btn primary" id="export">Export preview ↓</button></div></section>${!state.clientMode?`<div class="tabs" role="tablist" aria-label="Report type"><button role="tab" aria-selected="${state.view==='team'}" data-view="team" class="${state.view==='team'?'active':''}">Team performance <small style="margin-left:5px;color:#9aa9c0">Internal</small></button><button role="tab" aria-selected="${state.view==='client'}" data-view="client" class="${state.view==='client'?'active':''}">Client report</button></div><div class="filters">${period()}${state.view==='team'?roleOptions()+personOptions():`<label class="field"><span>Client</span><select id="client"><option ${state.client==='Northstar'?'selected':''}>Northstar</option><option ${state.client==='Luma'?'selected':''}>Luma</option></select></label>`}<span class="scope">${state.view==='team'?'Admin/team lead view · members see their own work':'One client per report · brand access applies'} · Sample data</span></div>`:''}${state.view==='team'?team():client()}<footer class="footer-brand"><span>finvera. <span style="margin-left:9px">Thoughtful work, clearly reported.</span></span><span>Design preview · sample data · ${monthLabel()}</span></footer>`;
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.clientMode=false;render()});for(const key of ['period','role','person','client']){const el=$('#'+key);if(el)el.onchange=()=>{state[key==='period'?'month':key]=el.value;render()}}document.querySelectorAll('.person-open').forEach(b=>b.onclick=()=>personDrawer(b.dataset.person));if($('#client-preview'))$('#client-preview').onclick=()=>{state.clientMode=true;render()};if($('#back-admin'))$('#back-admin').onclick=()=>{state.clientMode=false;render()};$('#export').onclick=exportDrawer;if($('#edit-summary'))$('#edit-summary').onclick=summaryDrawer;
}
function openDrawer(title,eyebrow,body,footer=''){focusBefore=document.activeElement;$('#modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div><span class="eyebrow">${eyebrow}</span><h2>${esc(title)}</h2></div><button class="btn" id="close" aria-label="Close panel">×</button></div><div class="drawer-body">${body}</div><div class="drawer-footer">${footer||'<button class="btn" id="done">Done</button>'}</div></section></div>`;$('#close').onclick=closeDrawer;if($('#done'))$('#done').onclick=closeDrawer;$('#close').focus();document.body.style.overflow='hidden'}
function closeDrawer(){$('#modal').innerHTML='';document.body.style.overflow='';if(focusBefore?.isConnected)focusBefore.focus()}
function personDrawer(name){const p=people.find(p=>p.name===name);openDrawer(p.name,'THE WORK BEHIND THE NUMBERS',`<p>${p.role} · ${monthLabel()} · sample data</p><div class="mini-metrics"><div><b>${n(p.completed)}</b><small>Completed in period</small></div><div><b>${p.open}</b><small>Open now</small></div><div><b>${p.overdue}</b><small>Overdue now</small></div></div><h3>Work ledger</h3>${[['A closer look at the craft','Completed handoff','22 Oct · finished before go-live',''],['Made for the everyday','In production','Go-live 8 Nov · current assignment','blue'],['Season launch creative','Overdue','Go-live 5 Nov · current assignment','amber']].map(([title,status,note,color])=>`<div class="task"><div><b>${title}</b><small>${note}</small></div><span class="pill ${color}">${status}</span></div>`).join('')}<h3>Assignment history</h3><p>Example: assigned to ${p.name} → work completed → handed to the social manager. Later ownership changes do not transfer this completion credit.</p><div class="notice">The ledger distinguishes completions in the selected period from the current open queue. All rows are illustrative.</div>`)}
function summaryDrawer(){openDrawer('Client summary','YOUR COMMENTARY',`<p>Use the report data to explain what happened and what you recommend next. Review this text before preparing a client copy.</p><label for="summary"><span class="eyebrow">SUMMARY</span></label><textarea id="summary" class="summary-editor">${esc(summaryText())}</textarea>`,'<button class="btn primary" id="save-summary">Save preview</button>');$('#save-summary').onclick=()=>{summaries[state.client]=$('#summary').value;closeDrawer();render()}}
function exportDrawer(){const isClient=state.view==='client';openDrawer(isClient?'Prepare client report':'Export team report','DESIGN PREVIEW · SAMPLE DATA',`<p>${isClient?'A client copy contains only this client’s delivery summary, published content, supported metrics and approved commentary.':'Internal export contains the selected team members and reporting period. It must never be sent as a client performance report.'}</p><div class="notice">These buttons export this local design preview only. No live data is fetched, no report is saved to Finvera and nothing is sent to a client.</div><h3>Included in this preview</h3>${(isClient?['Client name and reporting period','Content delivery and channel snapshot','Available metrics and coverage notes','Reviewed client summary']:['People and roles','Completed and assigned work','Current open/overdue queue','Go-live deadline definition']).map(x=>`<div class="toggle-row"><span class="pill">✓</span>${x}</div>`).join('')}<h3>Output</h3><p>PDF opens your browser’s print dialog. CSV downloads sample rows. Production exports will use server-enforced access checks and a fixed data snapshot.</p>`,`<button class="btn" id="csv">Sample CSV ↓</button><button class="btn primary" id="pdf">Print / save PDF ↗</button>`);$('#pdf').onclick=()=>{closeDrawer();window.print()};$('#csv').onclick=()=>{const rows=isClient?[['Content','Channel','Published IST','Reach','Reported interactions'],...posts.map((p,i)=>[p.title,p.channel,state.month==='2026-10'?p.date:['6 Nov, 10:00','4 Nov, 18:30','2 Nov, 10:00'][i],'Not available',n(Math.round(p.interactions*(state.client==='Luma'?284/436:1)))])]:[['Team member','Role','Assigned in period','Completed in period','Open now','Overdue now'],...filtered().map(p=>[p.name,p.role,n(p.assigned),n(p.completed),p.open,p.overdue])];const data='DESIGN PREVIEW - SAMPLE DATA\r\n'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`finvera-${isClient?'client':'team'}-report-sample.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.addEventListener('keydown',e=>{const dialog=$('.drawer');if(!dialog)return;if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const els=[...dialog.querySelectorAll('button,input,textarea,select,a[href]')].filter(el=>!el.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.querySelectorAll('[data-static]').forEach(a=>a.onclick=e=>e.preventDefault());render();
</script></body></html>
