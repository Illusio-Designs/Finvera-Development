name: Social workflow checks
on:
  push:
    branches: [main]
    paths: ["frontend/**", "Backendjs/**", ".github/workflows/social-checks.yml"]
  pull_request:
    paths: ["frontend/**", "Backendjs/**", ".github/workflows/social-checks.yml"]
  workflow_call:
    inputs:
      backend_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backendjs/package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: Backendjs
      - run: npm ci --no-audit --no-fund
        if: ${{ inputs.backend_only != true && github.base_ref != 'backend' }}
        working-directory: frontend
      - name: Type check frontend
        if: ${{ inputs.backend_only != true && github.base_ref != 'backend' }}
        run: ./node_modules/.bin/tsc --noEmit --incremental false
        working-directory: frontend
      - name: Backend regression tests
        working-directory: Backendjs
        run: |
          set -e
          for test_file in tests/*.test.js; do node "$test_file"; done
      - name: Calendar workflow regression tests
        if: ${{ inputs.backend_only != true && github.base_ref != 'backend' }}
        run: node tests/social-workflow.test.cjs
        working-directory: frontend
