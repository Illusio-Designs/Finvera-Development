function settings(p){let tab=currentTab||p.tabs[0];let f=tab==='Analytics & pixels'?['Google Analytics measurement ID','Meta pixel ID']:tab==='Social links'?['Instagram URL','Facebook URL','LinkedIn URL']:['Business name','Public email','Phone','Office address'];return `<div class="settings-layout"><nav class="settings-local" aria-label="Settings sections">${p.tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</nav><section class="panel"><div class="panel-head"><h2>${tab}</h2><span class="subtle">Website configuration</span></div><div class="panel-body"><div class="notice">${tab==='Analytics & pixels'?'Tracking identifiers belong here. Publishing permissions and connected accounts stay in Social studio.':'Keep routine website settings separate from system health and account security.'}</div>${f.map((label,i)=>field(label,['Finvera Solutions LLP','hello@finvera.solutions','+91 90000 00000','Mumbai, India'][i]||'')).join('')}</div><div class="savebar"><span class="subtle">Sample form · No live data</span>${btn('Save changes',true,'sample')}</div></section></div>`}
function field(label,value=''){let long=/Description|Content|Quote|Answer|Bio|Notes|Reply|Excerpt/i.test(label);let select=/Status|Roles|Stage|Owner|Cycle|Brand access/.test(label);return `<div class="field"><label>${esc(label)}</label>${long?`<textarea aria-label="${esc(label)}">${esc(value)}</textarea>`:select?`<select aria-label="${esc(label)}"><option>${esc(value||'Choose an option')}</option><option>Sample option</option></select>`:`<input aria-label="${esc(label)}" value="${esc(value)}" placeholder="${esc(label)}">`}</div>`}
function system(){if(currentTab==='Backups')return table({id:'system',title:'Backups',columns:['Backup','Created','Result'],rows:[['Daily backup','05 Nov · 02:30 AM','Healthy'],['Daily backup','04 Nov · 02:30 AM','Healthy']],fields:[]});if(currentTab==='Scheduled jobs')return table({id:'system',title:'Scheduled jobs',columns:['Job','Schedule','Last result'],rows:[['Publishing worker','Every minute','Healthy'],['Daily reminders','10:15 AM IST','Healthy'],['Account check','09:00 AM IST','Needs review']],fields:[]});return `<div class="notice">Sample status only. This artifact does not connect to your server or verify production health.</div><div class="health">${[['Database','Healthy','24 ms','Sample connection response'],['Email delivery','Healthy','Ready','Outbound mail configuration'],['Last backup','Healthy','Today, 02:30 AM','Daily database backup'],['Scheduled jobs','Needs review','1 attention item','Open Social studio for account readiness']].map(r=>`<div class="health-card"><div class="head"><h3>${r[0]}</h3>${badge(r[1])}</div><strong>${r[2]}</strong><p>${r[3]}</p></div>`).join('')}</div><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Recent checks</h2><span class="subtle">Last checked just now · Sample</span></div><div class="panel-body"><div class="task-row"><span class="square">${icon('shield')}</span><div class="task-copy"><b>Infrastructure and accounts are separate</b><small>Keep system reliability here. Resolve Meta permissions in Channels.</small></div><button class="button" data-go="social-studio">Social studio ${icon('arrow')}</button></div></div></section>`}
function account(p){if(currentTab==='Profile')return `<div class="grid2"><section class="panel"><div class="panel-head"><h2>Profile details</h2><span class="subtle">Your personal account</span></div><div class="panel-body"><span class="avatar" style="width:64px;height:64px;font-size:18px;margin-bottom:24px">RS</span>${field('Full name','Rishi Soni')}${field('Email','rishi@example.com')}<p class="subtle">Example email address · Profile photo controls belong beside your avatar.</p></div><div class="savebar"><span class="subtle">Sample form</span>${btn('Save profile',true,'sample')}</div></section><section class="panel" style="align-self:start"><div class="panel-head"><h2>Account security</h2></div><div class="panel-body"><div class="task-row"><span class="square">${icon('shield')}</span><div class="task-copy"><b>Two-step login</b><small>Add another layer of sign-in protection.</small></div>${badge('Enabled')}</div><button class="button" data-tab-go="Devices">Review signed-in devices</button></div></section></div>`;if(currentTab==='Password')return `<div class="panel"><div class="panel-head"><h2>Change your password</h2></div><div class="panel-body" style="max-width:570px">${field('Current password')}${field('New password')}${field('Confirm new password')}<div class="notice">Routine profile details stay separate from sensitive account changes.</div>${btn('Update password',true,'sample')}</div></div>`;if(currentTab==='Devices')return table({id:'account',title:'Devices',columns:['Device','Location','Last active','Session'],rows:[['Chrome · MacBook','Mumbai, India','Just now','Current device'],['Safari · iPhone','Mumbai, India','Yesterday','Active']],fields:[]});return `<section class="panel"><div class="panel-head"><h2>${esc(currentTab)}</h2>${badge('Design preview')}</div><div class="panel-body"><div class="notice">${currentTab==='Two-step login'?'Manage authenticator setup and recovery codes in a focused security section.':currentTab==='Emails'?'Choose notification categories without changing your sign-in settings.':'Your own sign-ins and security actions, separate from the company-wide Activity log.'}</div>${currentTab==='Emails'?['Calendar assignments','Publishing updates','Security alerts'].map(x=>`<div class="task-row"><label><input type="checkbox" checked> ${x}</label></div>`).join(''):`<div class="task-row"><span class="square">${icon('shield')}</span><div class="task-copy"><b>${currentTab==='Two-step login'?'Authenticator protection is enabled':'Recent sign-in'}</b><small>Sample account state — no real security action is performed.</small></div>${badge('Active')}</div>`}</div></section>`}
function renderBody(p){switch(p.kind){case'overview':return overview();case'social':return social();case'studio':return studio();case'leads':return leads(p);case'inbox':return inbox();case'hub':return hub();case'portfolio':return portfolio(p);case'team':return team(p);case'quotes':return quotes(p);case'seo':return seo(p);case'settings':return settings(p);case'system':return system();case'account':return account(p);case'renewals':return `<div class="metrics">${metric('Due in 14 days','2','Upcoming client services')}${metric('Overdue','1','Needs an owner’s follow-up')}${metric('Active renewals','16','Across current clients')}${metric('Unassigned','0','Every service has an owner')}</div>${table(p)}`;case'collection':return `<div class="notice">${esc(p.notes[0])} This is a website content collection, not a business KPI or task list.</div>${table(p)}<div class="site-preview" style="margin-top:20px"><div class="eyebrow">CONTEXTUAL WEBSITE PREVIEW</div><h2>${p.id==='stats'?'120+ projects. 35+ brands. A lot of care.':p.id==='timeline'?'A journey, one meaningful step at a time.':p.id==='faqs'?'A few things you might be wondering.':esc(p.rows[0][0])}</h2><p class="subtle">Illustrative placement · Editing opens a focused form with order and publication state.</p></div>`;case'blog':return `<div class="notice">Write in a full editor. Keep publication settings and article metadata in a supporting panel.</div>${table(p,currentTab==='Drafts'?p.rows.filter(row=>row.at(-1)==='Draft'):currentTab==='Published'?p.rows.filter(row=>row.at(-1)==='Published'):p.rows)}`;case'users':if(currentTab==='Security log')return table({...p,kind:'activity',id:'activity',columns:['Event','Person','Time','Result'],rows:[['Sign-in','Rishi Soni','Today, 10:40 AM','Active'],['Invitation accepted','Maya Patel','Yesterday','Active']]});return `<div class="notice">Website team profiles do not grant sign-in access. Roles and brand access are controlled here.</div>${table(p,currentTab==='Invitations'?p.rows.filter(row=>row.at(-1)==='Invited'):p.rows)}`;default:return table(p)}}
function render(){const p=find(current);lastTable=null;document.title=`${p.title} · Finvera design`;$('#crumb').innerHTML=`<span class="crumb-parent">${p.group}</span><span class="crumb-parent">${icon('chevron')}</span><b>${p.title}</b>`;renderNav();$('#content').innerHTML=`<section class="page-head"><div><p class="eyebrow">${p.group}</p><h1>${p.id==='overview'?'Your day, in focus.':p.title}</h1><p class="description">${p.description}</p></div>${btn(p.id==='overview'?'Quick actions':p.action,true)}</section>${p.kind==='settings'?'':tabs(p)}${renderBody(p)}<footer class="route-foot"><span>DESIGN PREVIEW · Sample content · No live changes</span><code>${p.route}</code><button class="text-link" data-action="notes">Page design notes ${icon('arrow')}</button></footer>`;bindContent();}
function bindContent(){$$('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;searchTerm='';statusFilter='All statuses';render()});$$('[data-tab-go]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tabGo;render()});$$('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go);$$('[data-row]').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.row)));$$('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$$('[data-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.task));$('#table-search')?.addEventListener('input',e=>{searchTerm=e.target.value;$('#table-rows').innerHTML=tableRows(lastTable,lastTable.rows);$$('[data-row]').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.row)))});$('#status-filter')?.addEventListener('change',e=>{statusFilter=e.target.value;$('#table-rows').innerHTML=tableRows(lastTable,lastTable.rows);$$('[data-row]').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.row)))});$$('[data-message]').forEach(b=>b.onclick=()=>{$$('.message').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('Sample message selection. No mailbox is connected.');});}
function act(a){if(a==='notes')openNotes();else if(a==='search')openSearch();else if(a==='primary'){const p=find(current);if(p.kind==='overview'){modal('Create something good',`<p class="description" style="margin-bottom:20px">Choose the workspace for your next piece of work.</p><div class="map-grid">${['social','leads','blog','renewals'].filter(id=>allowed(find(id))).map(id=>`<button class="map-tile" data-modal-go="${id}"><small>${find(id).group}</small><b>${find(id).action}</b></button>`).join('')}</div>`);return}if(p.kind==='hub'){openSearch();return}if(p.kind==='account'||p.kind==='settings'){toast('Design preview only. These settings were not saved.');return}if(p.kind==='system'){toast('Design preview only. No server check was requested.');return}if(p.kind==='activity'||p.kind==='inbox'){openFilters();return}if(p.kind==='social')openTask('Planned');else openEditor()}else if(a==='filters')openFilters();else if(a==='edit')openEditor();else if(a==='reply')openEditor(undefined,['To','Subject','Reply']);else if(a==='readiness')modal('Readiness & actions',`<p class="description">Crosscoin · Instagram · Sample evidence</p>${['Token and app access — verified','Read profile — verified','Publishing scope — granted','Image profile tags — needs a live test','Edit Instagram profile — opens Instagram'].map(t=>`<div class="task-row">${icon('shield')}<span>${t}</span></div>`).join('')}<div class="notice">No token is inspected and no Meta request is made by this artifact.</div>`);else if(a==='profile')modal('Profile actions','<p>Instagram profile edits open Instagram. Supported Facebook Page details use a separate editable form.</p><div class="notice">This is a design preview; external profiles are not opened.</div>');else toast('Design preview only — no live data was changed.');}
function modal(title,body,drawer=false){$('#overlays').innerHTML=`<div class="overlay ${drawer?'drawer-overlay':''}" data-backdrop><section class="${drawer?'drawer':'modal'}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title">${esc(title)}</h2><button class="button" data-close aria-label="Close">${icon('close')}</button></header><div class="modal-body">${body}</div></section></div>`;$('#overlays [data-close]').onclick=closeModal;$('#overlays [data-backdrop]').onclick=e=>{if(e.target.hasAttribute('data-backdrop'))closeModal()};$('#overlays [data-close]').focus();$('#overlays').querySelectorAll('[data-preview-save]').forEach(b=>b.onclick=()=>{closeModal();toast('Preview complete. Nothing was saved to Finvera.')});$('#overlays').querySelectorAll('[data-modal-go]').forEach(b=>b.onclick=()=>{closeModal();location.hash=b.dataset.modalGo});}
function closeModal(){$('#overlays').innerHTML=''}
function openEditor(index,override){let p=find(current);if((['activity','system','social-studio'].includes(p.id)||p.id==='users'&&currentTab==='Security log')&&index!=null){modal('Record details',`<p>${esc(lastTable?.rows[index]?.join(' · ')||'Sample record')}</p><div class="notice">This record is read-only. Live platform posts, system checks and audit history do not use a content-editing form.</div>`);return}const row=index==null?null:(lastTable?.rows||p.rows)[index];let fields=override||p.fields;if(!fields.length)fields=['Account','Platform'];if(p.kind==='blog'){modal(row?'Edit article':'New article',`<div class="writing" contenteditable="true" role="textbox" aria-label="Article draft"><h2>${row?esc(row[0]):'Give your next idea a title'}</h2><p>Start with the thought your reader needs. This is a local design surface, not a connected editor.</p></div><div class="notice" style="margin-top:20px">Publication metadata belongs in a supporting panel in the approved implementation.</div><button class="button primary" data-preview-save>Close writing preview</button>`);return}modal(row?`Edit ${p.title.toLowerCase()}`:p.action,`<p class="description" style="margin-bottom:23px">${p.description}</p>${fields.map((f,i)=>field(f,row&&i===0?row[0]:'')).join('')}<div class="savebar" style="padding:17px 0"><span class="subtle">Local design preview</span><button class="button primary" data-preview-save>Done previewing</button></div>`,true)}
function openTask(stage){const t=TASKS.find(t=>t.stage===stage);let body='';if(stage==='Production')body=`<p class="description" style="margin-bottom:23px">${t.name} · ${t.brand}</p><div class="upload-drop">${icon('upload')}<h2>Give your idea its final look.</h2><p>Only the final artwork belongs in this handoff.</p><label class="button primary" style="cursor:pointer">Upload<input type="file" hidden id="sample-file"></label></div><p class="subtle" id="file-note">Local preview only. Files are not uploaded anywhere.</p><button class="button primary" data-preview-save style="width:100%;margin-top:20px">Send for review · Preview</button>`;else if(stage==='Review')body=`<div class="site-preview"><div class="eyebrow">CROSSCOIN / CAROUSEL</div><h2>The Everyday Pair.</h2><p>Plain unisex ankle socks. A little comfort, every day.</p></div><p class="description">Review the saved version, then approve the next step.</p>${['Artwork and slide order','Final caption and hashtags','Instagram tags','Channels and go-live time'].map(x=>`<div class="task-row"><label><input type="checkbox"> ${x}</label></div>`).join('')}<div class="inline-actions" style="margin-top:22px"><button class="button primary" data-preview-save>Approve & schedule · Preview</button><button class="button" data-preview-save>Request changes</button></div>`;else if(stage==='Need from client')body=`<div class="notice amber">Waiting for product photos</div>${field('What is missing?','Final product photos for the new collection.')}${field('Follow-up date','06 Nov 2026')}${field('Contact owner','Maya Patel')}<button class="button primary" data-preview-save>Done previewing</button>`;else if(stage==='Scheduled'||stage==='Published')body=`<div class="notice">${stage==='Scheduled'?'Goes live 06 Nov 2026 · 10:00 AM IST':'Published platform results stay separate.'}</div><div class="task-row"><h3>Instagram</h3><span style="margin-left:auto">${badge(stage==='Scheduled'?'Scheduled':'Published')}</span></div><div class="task-row"><h3>Facebook</h3><span style="margin-left:auto">${badge(stage==='Scheduled'?'Scheduled':'Published')}</span></div><details style="margin:24px 0"><summary>Content & requirements</summary><p>Saved content is supporting information, not another editing form.</p></details><button class="button primary" data-preview-save>${stage==='Scheduled'?'Edit scheduled post · Preview':'Open live links · Preview'}</button>`;else body=`<p class="description" style="margin-bottom:22px">Use the calendar data you already have. Choose the owner and deadline before work begins.</p>${['Brand','Post theme','Format','Assigned maker','Go-live date & time'].map((f,i)=>field(f,['Crosscoin',t.name,'Static post','Arjun Shah','10 Nov 2026 · 10:00 AM IST'][i])).join('')}<button class="button primary" data-preview-save>Start work · Preview</button>`;modal(stage==='Production'?'Upload':stage==='Review'?'Review saved post':stage,body,true);$('#sample-file')?.addEventListener('change',e=>{$('#file-note').textContent=e.target.files[0]?`Selected locally: ${e.target.files[0].name}. No upload was made.`:'No file selected.'})}
function openFilters(){modal('Focused filters',`<div class="notice">Keep common filters visible. Put less frequent options here.</div>${['Owner','Date range','Status'].map(x=>field(x)).join('')}<button class="button primary" data-preview-save>Done previewing</button>`)}
function openNotes(){const p=find(current);modal(`${p.title} · Design notes`,`<p class="eyebrow">${p.group} / EXISTING ROUTE</p><code>${p.route}</code><ul class="notes">${p.notes.map(n=>`<li>${n}</li>`).join('')}</ul><div class="notice">Concept 02 preserves Finvera’s actual mark, Sora + Inter, Hugeicons, blue gradient and stage colours. Approval scope: the two-level navigation, page layouts and interaction patterns. This artifact does not change application code, permissions or backend data.</div>`)}
function openMap(){modal('All 27 dashboard pages',`<p class="description" style="margin-bottom:19px">Every existing route is accounted for. Showing ${PAGES.filter(allowed).length} pages for the selected role.</p><div class="map-grid">${PAGES.filter(allowed).map(p=>`<button class="map-tile" data-modal-go="${p.id}"><small>${p.group}</small><b>${p.title}</b><code>${p.route}</code></button>`).join('')}</div>`)}
function openSearch(){modal('Find any page',`<div class="search" style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:18px">${icon('search')}<input id="global-search" aria-label="Search all accessible pages" placeholder="Try ‘logos’, ‘users’ or ‘calendar’…" style="width:100%"></div><div id="search-results" class="map-grid"></div>`);const populate=term=>{$('#search-results').innerHTML=PAGES.filter(allowed).filter(p=>[p.title,p.id,p.group,p.route].join(' ').toLowerCase().includes(term.toLowerCase())).map(p=>`<button class="map-tile" data-modal-go="${p.id}"><small>${p.group}</small><b>${p.title}</b><code>${p.route}</code></button>`).join('')||'<p class="subtle">No accessible pages match.</p>';$('#search-results').querySelectorAll('[data-modal-go]').forEach(b=>b.onclick=()=>{closeModal();location.hash=b.dataset.modalGo})};populate('');$('#global-search').oninput=e=>populate(e.target.value);$('#global-search').focus()}
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),3500)}
function go(){let requested=location.hash.slice(1)||DEFAULT_PAGE;let p=find(requested);if(!allowed(p)){requested='overview';p=find('overview')}if(current!==requested){currentTab='';searchTerm='';statusFilter='All statuses'}current=requested;if(!currentTab)currentTab=p.tabs[0]||'';if(GROUPS.some(g=>g.name===p.group))openGroups=new Set([p.group]);if(p.kind==='collection')collectionsOpen=true;$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on');closeModal();render();window.scrollTo(0,0)}
$('#role').onchange=e=>{role=e.target.value;openGroups=new Set(['Social media']);if(!allowed(find(current))){location.hash='overview';go()}else{renderNav();render()}};$('#menu').onclick=()=>{$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('on')};$('#scrim').onclick=()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on')};$('#all-pages').onclick=openMap;$('#workspace-search').onclick=openSearch;$('#notes').onclick=openNotes;$('#bell').onclick=()=>toast('Sample notifications. This concept is not connected to your account.');window.addEventListener('hashchange',go);document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on')}if(e.key==='Tab'&&$('#overlays [role=dialog]')){const nodes=Array.from($('#overlays [role=dialog]').querySelectorAll('button,input,select,textarea,a[href],[tabindex]')).filter(n=>!n.disabled&&n.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});go();
</script></body></html>
